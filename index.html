<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎯 Multiplayer Bingo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #0d1b2a 0%, #1b2f44 100%);
            min-height: 100vh;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 6px;
            margin: 0;
            overflow: hidden;
        }
        .game-wrapper {
            max-width: 420px;
            width: 100%;
            height: 100vh;
            max-height: 780px;
            background: #1a2f44;
            border-radius: 28px;
            padding: 12px 10px 14px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid #3a5f7a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .hidden {
            display: none !important;
        }
        .title {
            text-align: center;
            font-weight: 800;
            font-size: 1.3rem;
            letter-spacing: 2px;
            color: #f5e7c8;
            text-shadow: 0 2px 0 #6f4a2a, 0 4px 8px rgba(0, 0, 0, 0.5);
            line-height: 1.1;
            flex-shrink: 0;
        }
        .title small {
            font-size: 0.6rem;
            letter-spacing: 1px;
            opacity: 0.7;
            display: block;
            font-weight: 400;
            color: #b8d0e5;
        }
        .connection-status {
            text-align: center;
            font-size: 0.65rem;
            padding: 2px 4px;
            flex-shrink: 0;
            border-radius: 20px;
            margin: 2px 0;
        }
        .connection-status.connected {
            color: #5f5;
            background: #0f2f1f;
        }
        .connection-status.disconnected {
            color: #f55;
            background: #2f0f0f;
        }
        .player-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
            flex-shrink: 0;
            margin-bottom: 4px;
            min-height: 22px;
        }
        .player-tag {
            background: #0f1f30;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.55rem;
            color: #b8d0e5;
            border: 1px solid #2a4a6a;
        }
        .player-tag.me {
            border-color: #f5c542;
            color: #f5c542;
        }
        .player-tag.ready {
            border-color: #5f5;
            color: #5f5;
        }
        .round-info {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.65rem;
            color: #b8d0e5;
            flex-shrink: 0;
            margin: 2px 0;
        }
        .round-info span {
            background: #0f1f30;
            padding: 2px 12px;
            border-radius: 30px;
            border: 1px solid #2a4a6a;
        }
        .round-info .highlight {
            color: #f5c542;
            font-weight: 700;
        }
        .wheel-container {
            position: relative;
            width: 100%;
            max-width: 200px;
            margin: 4px auto;
            aspect-ratio: 1/1;
            flex-shrink: 0;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #e68a2e 0%, #f5c542 10%, #e68a2e 20%, #f5c542 30%, #e68a2e 40%, #f5c542 50%, #e68a2e 60%, #f5c542 70%, #e68a2e 80%, #f5c542 90%, #e68a2e 100%);
            position: relative;
            box-shadow: 0 0 0 4px #f5c542, 0 0 0 6px #1a2f44, 0 0 20px rgba(245, 197, 66, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }
        .arrow-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 15;
            transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .arrow-shaft {
            position: absolute;
            width: 4px;
            height: 35%;
            background: #ff6b6b;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0 0 8px rgba(255, 107, 107, 0.6));
            border-radius: 2px;
        }
        .arrow-head {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #ff6b6b;
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            top: 12%;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0 0 12px rgba(255, 107, 107, 0.8));
        }
        .arrow-center-circle {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #f5c542;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 16;
            border: 2px solid #1a2f44;
            box-shadow: 0 0 15px rgba(245, 197, 66, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.6rem;
            color: #1f2a1a;
            pointer-events: none;
        }
        .wheel-numbers {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 5;
        }
        .wheel-number {
            position: absolute;
            font-weight: 700;
            font-size: 0.6rem;
            color: #1f2a1a;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.4);
            pointer-events: none;
            z-index: 6;
            transition: all 0.3s;
        }
        .wheel-number.highlighted {
            color: #ff6b6b;
            font-size: 0.8rem;
            text-shadow: 0 0 20px rgba(255, 107, 107, 0.8);
            font-weight: 900;
        }
        .spin-results {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 4px 0;
            flex-shrink: 0;
        }
        .spin-ball {
            background: #142b3f;
            border: 2px solid #3a5a7a;
            color: #d4e6fa;
            font-weight: 800;
            font-size: 1rem;
            padding: 3px 14px;
            border-radius: 30px;
            min-width: 36px;
            text-align: center;
            transition: all 0.3s;
        }
        .spin-ball.active {
            background: #f5c542;
            border-color: #ffe28a;
            color: #1f2a1a;
            box-shadow: 0 0 20px #f5c54266;
            transform: scale(1.05);
        }
        .spin-ball.winner {
            background: #ff6b6b;
            border-color: #ff8a8a;
            color: white;
            box-shadow: 0 0 20px #ff6b6b66;
        }
        .status-area {
            background: #0f1f30dd;
            backdrop-filter: blur(4px);
            border-radius: 30px;
            padding: 6px 10px;
            margin: 4px 0 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: #d4e6fa;
            border: 1px solid #2a4a6a;
            min-height: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px #00000044;
        }
        .status-area .highlight {
            color: #f5c542;
            font-weight: 800;
        }
        .win-badge {
            background: #f5c542;
            color: #1f2a1a;
            padding: 3px 14px;
            border-radius: 30px;
            font-weight: 800;
            box-shadow: 0 0 25px #f5c542cc;
            animation: pulse 1s infinite alternate;
            font-size: 0.75rem;
        }
        @keyframes pulse {
            0% {
                opacity: 0.8;
                transform: scale(0.97);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
        .profile-area {
            background: #142b3f;
            border-radius: 16px;
            padding: 6px 8px;
            margin-bottom: 4px;
            border: 1px solid #2a4a6a;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        .profile-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            margin-bottom: 4px;
        }
        .profile-row:last-child {
            margin-bottom: 0;
        }
        .profile-label {
            color: #b8d0e5;
            font-weight: 600;
            font-size: 0.65rem;
            min-width: 40px;
        }
        .player-select {
            background: #1f3a54;
            color: #f0f6fe;
            border: 1px solid #3a6a8a;
            border-radius: 20px;
            padding: 2px 8px;
            font-weight: 600;
            font-size: 0.7rem;
            min-width: 60px;
            flex: 1 1 60px;
            cursor: pointer;
            outline: none;
        }
        .player-select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .player-select:focus {
            border-color: #f5c542;
            box-shadow: 0 0 0 2px #f5c54266;
        }
        .num-picker {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            overflow: hidden;
            padding: 2px 0;
            min-height: 0;
        }
        .num-btn {
            background: #2a4a6a;
            border: none;
            border-radius: 4px;
            padding: 0;
            font-weight: 700;
            font-size: 0.5rem;
            color: #d4e6fa;
            box-shadow: 0 2px 0 #0f1f30;
            cursor: pointer;
            transition: all 0.06s linear;
            border: 1px solid #4a7a9a;
            text-align: center;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
            min-height: 0;
            line-height: 1;
        }
        .num-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f1f30;
        }
        .num-btn.selected {
            background: #f5c542;
            color: #1f2a1a;
            border-color: #ffe28a;
            box-shadow: 0 0 10px #f5c54288, 0 2px 0 #8f6a1a;
        }
        .num-btn.taken {
            background: #4a4a6a;
            color: #8a8aaa;
            border-color: #3a3a5a;
            box-shadow: 0 2px 0 #2a2a4a;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .num-btn:disabled {
            opacity: 0.4;
            transform: translateY(1px);
            box-shadow: 0 1px 0 #0f1f30;
            pointer-events: none;
        }
        .btn-group {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            flex-shrink: 0;
            margin-top: 3px;
        }
        .btn {
            background: #2a4a6a;
            border: none;
            border-radius: 16px;
            padding: 3px 8px;
            font-weight: 700;
            font-size: 0.6rem;
            color: #f0f6fe;
            box-shadow: 0 3px 0 #0f1f30, 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.06s linear;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 2px;
            border: 1px solid #4a7a9a;
            flex: 1 1 auto;
            justify-content: center;
            min-width: 40px;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0f1f30;
        }
        .btn:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f1f30;
            pointer-events: none;
        }
        .btn-success {
            background: #2a8a4a;
            border-color: #4aaa6a;
            color: #f0fff0;
            box-shadow: 0 3px 0 #145a2a;
        }
        .btn-success:active {
            box-shadow: 0 1px 0 #145a2a;
        }
        .btn-secondary {
            background: #3a5a7a;
            border-color: #5a8aaa;
        }
        .btn-warning {
            background: #b8860b;
            border-color: #daa520;
            color: #fff8e0;
            box-shadow: 0 3px 0 #6b4f0a;
        }
        .btn-warning:active {
            box-shadow: 0 1px 0 #6b4f0a;
        }
        .btn-danger {
            background: #8a2a2a;
            border-color: #aa4a4a;
            color: #fff0f0;
            box-shadow: 0 3px 0 #4a1a1a;
        }
        .btn-danger:active {
            box-shadow: 0 1px 0 #4a1a1a;
        }
        .winners-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }
        .winners-modal.active {
            display: flex;
        }
        .winners-content {
            background: #1a2f44;
            border-radius: 28px;
            padding: 20px 16px;
            max-width: 360px;
            width: 100%;
            max-height: 70vh;
            overflow-y: auto;
            border: 2px solid #f5c542;
            box-shadow: 0 0 40px #f5c54244;
        }
        .winners-content h2 {
            color: #f5e7c8;
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 10px;
            border-bottom: 2px solid #3a5a7a;
            padding-bottom: 8px;
        }
        .winner-entry {
            background: #142b3f;
            border-radius: 14px;
            padding: 8px 12px;
            margin-bottom: 8px;
            border-left: 4px solid #f5c542;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
        }
        .winner-entry .player-name {
            color: #f5e7c8;
            font-weight: 700;
            font-size: 0.9rem;
        }
        .winner-entry .winning-nums {
            color: #ffd966;
            font-weight: 600;
            font-size: 0.8rem;
            background: #0f1f30;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .close-modal-btn {
            background: #f5c542;
            border: none;
            border-radius: 30px;
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1f2a1a;
            cursor: pointer;
            margin-top: 6px;
            width: 100%;
            box-shadow: 0 4px 0 #8f6a1a;
            transition: 0.06s linear;
        }
        .close-modal-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #8f6a1a;
        }
        .no-winners {
            color: #b8d0e5;
            text-align: center;
            font-size: 0.9rem;
            padding: 12px 0;
        }
        .footer {
            color: #5a7a9a;
            text-align: center;
            font-size: 0.5rem;
            margin-top: auto;
            opacity: 0.6;
            border-top: 1px solid #1a2f44;
            padding-top: 4px;
            flex-shrink: 0;
        }

        /* Connection Overlay */
        .connection-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 28px;
            padding: 20px;
            gap: 16px;
        }
        .connection-overlay h2 {
            color: #f5e7c8;
            font-size: 1.5rem;
            text-shadow: 0 2px 0 #6f4a2a;
        }
        .connection-overlay input {
            background: #1f3a54;
            color: #f0f6fe;
            border: 2px solid #3a6a8a;
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 1rem;
            width: 80%;
            max-width: 250px;
            text-align: center;
            outline: none;
        }
        .connection-overlay input:focus {
            border-color: #f5c542;
        }
        .connection-overlay .btn-connect {
            background: #f5c542;
            color: #1f2a1a;
            border: none;
            border-radius: 30px;
            padding: 12px 40px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #8f6a1a;
            transition: 0.06s linear;
        }
        .connection-overlay .btn-connect:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #8f6a1a;
        }
        .connection-overlay .status-text {
            color: #b8d0e5;
            font-size: 0.8rem;
        }

        @media (max-height: 700px) {
            .game-wrapper {
                padding: 8px 8px 10px;
                max-height: 680px;
            }
            .title {
                font-size: 1.1rem;
            }
            .wheel-container {
                max-width: 160px;
                margin: 2px auto;
            }
            .wheel-number {
                font-size: 0.5rem;
            }
            .spin-ball {
                font-size: 0.75rem;
                padding: 2px 8px;
                min-width: 28px;
            }
            .status-area {
                font-size: 0.65rem;
                padding: 4px 8px;
                min-height: 2rem;
            }
            .num-btn {
                font-size: 0.45rem;
            }
            .btn {
                font-size: 0.55rem;
                padding: 2px 6px;
                min-width: 35px;
            }
            .arrow-head {
                width: 14px;
                height: 14px;
            }
            .arrow-shaft {
                height: 30%;
            }
            .round-info {
                font-size: 0.6rem;
            }
        }
        @media (max-width: 380px) {
            .game-wrapper {
                padding: 6px 6px 10px;
            }
            .title {
                font-size: 1rem;
            }
            .wheel-container {
                max-width: 140px;
            }
            .num-btn {
                font-size: 0.4rem;
            }
            .btn {
                font-size: 0.5rem;
                padding: 2px 4px;
                min-width: 30px;
            }
            .wheel-number {
                font-size: 0.45rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-wrapper" id="app">
        <!-- Connection Overlay -->
        <div class="connection-overlay" id="connectionOverlay">
            <h2>🎯 Multiplayer Bingo</h2>
            <input type="text" id="playerNameInput" placeholder="Your name" value="Player" maxlength="12">
            <button class="btn-connect" id="connectBtn">Connect</button>
            <div class="status-text" id="connStatus">Enter a name and connect</div>
        </div>

        <div class="title">
            🎯 MULTI BINGO
            <small>real-time · multiple devices</small>
        </div>

        <div class="connection-status disconnected" id="connectionStatus">🔴 Disconnected</div>

        <div class="player-list" id="playerList"></div>

        <div class="round-info">
            <span>Round <span id="roundDisplay" class="highlight">1</span></span>
            <span>⏱️ <span id="timerDisplay" class="highlight">30</span>s</span>
        </div>

        <div class="wheel-container hidden" id="wheelContainer">
            <div class="wheel" id="wheel">
                <div class="wheel-numbers" id="wheelNumbers"></div>
                <div class="arrow-container" id="arrowContainer">
                    <div class="arrow-shaft"></div>
                    <div class="arrow-head"></div>
                </div>
                <div class="arrow-center-circle" id="arrowCenter">🎯</div>
            </div>
        </div>

        <div class="spin-results hidden" id="spinResults">
            <span class="spin-ball" id="spin1">•</span>
            <span class="spin-ball" id="spin2">•</span>
            <span class="spin-ball" id="spin3">•</span>
        </div>

        <div class="status-area" id="statusMessage">
            <span>⏳ Connecting...</span>
        </div>

        <div class="profile-area">
            <div class="profile-row">
                <span class="profile-label">👤</span>
                <select class="player-select" id="playerSelect" disabled>
                    <option value="0">P1</option>
                    <option value="1">P2</option>
                    <option value="2">P3</option>
                    <option value="3">P4</option>
                    <option value="4">P5</option>
                </select>
                <span style="color:#b8d0e5; font-size:0.6rem;">
                    (<span id="selectedCount">0</span>/5)
                </span>
            </div>
            <div class="num-picker" id="numPicker"></div>
            <div class="btn-group">
                <button class="btn btn-success" id="savePicksBtn">💾 Save</button>
                <button class="btn btn-secondary" id="clearPicksBtn">🗑️</button>
                <button class="btn btn-warning" id="showWinnersBtn">🏆</button>
                <button class="btn btn-danger" id="resetGameBtn">🔄 Reset</button>
            </div>
        </div>

        <div class="footer">Play responsibly · 21+ · unique numbers</div>
    </div>

    <div class="winners-modal" id="winnersModal">
        <div class="winners-content">
            <h2>🏆 Winners</h2>
            <div id="winnersList"></div>
            <button class="close-modal-btn" id="closeModalBtn">Close</button>
        </div>
    </div>

    <script>
        (function() {
            // ----- Configuration -----
            const TOTAL_CARDS = 100;
            const PICK_LIMIT = 5;
            const MAX_SPINS = 3;

            // ----- DOM refs -----
            const connectionOverlay = document.getElementById('connectionOverlay');
            const playerNameInput = document.getElementById('playerNameInput');
            const connectBtn = document.getElementById('connectBtn');
            const connStatus = document.getElementById('connStatus');
            const connectionStatusEl = document.getElementById('connectionStatus');
            const playerListEl = document.getElementById('playerList');
            const wheelContainer = document.getElementById('wheelContainer');
            const spinResults = document.getElementById('spinResults');
            const wheelNumbers = document.getElementById('wheelNumbers');
            const arrowContainer = document.getElementById('arrowContainer');
            const arrowCenter = document.getElementById('arrowCenter');
            const statusEl = document.getElementById('statusMessage');
            const playerSelect = document.getElementById('playerSelect');
            const numPicker = document.getElementById('numPicker');
            const selectedCountSpan = document.getElementById('selectedCount');
            const spinEls = [document.getElementById('spin1'), document.getElementById('spin2'), document.getElementById('spin3')];
            const winnersModal = document.getElementById('winnersModal');
            const winnersList = document.getElementById('winnersList');
            const roundDisplay = document.getElementById('roundDisplay');
            const timerDisplay = document.getElementById('timerDisplay');

            // ----- State -----
            let ws = null;
            let myId = null;
            let players = {};
            let gameState = {
                phase: 'selection',
                round: 1,
                timer: 30,
                drawnNumbers: [],
                spinCount: 0,
                winners: [],
                allTakenNumbers: [],
            };
            let tempSelection = new Set();
            let reconnectAttempts = 0;
            let reconnectTimer = null;

            // ----- Helper functions -----
            function updateStatus(msg, isWin = false) {
                if (isWin) {
                    statusEl.innerHTML = `<span class="win-badge">🏆 ${msg}</span>`;
                } else {
                    statusEl.innerHTML = msg;
                }
            }

            function renderNumberPicker() {
                let html = '';
                const myPicks = (myId && players[myId]) ? players[myId].picks || [] : [];
                for (let i = 1; i <= TOTAL_CARDS; i++) {
                    const isSelected = tempSelection.has(i);
                    const isAlreadyPicked = myPicks.includes(i);
                    const isTakenByOther = gameState.allTakenNumbers.includes(i) && !isAlreadyPicked;
                    const disabled = isTakenByOther || (tempSelection.size >= PICK_LIMIT && !isSelected) ||
                        gameState.phase !== 'selection' || !myId;
                    let cls = 'num-btn';
                    if (isSelected || isAlreadyPicked) cls += ' selected';
                    if (isTakenByOther && !isAlreadyPicked) cls += ' taken';
                    html += `<button class="${cls}" data-num="${i}" ${disabled ? 'disabled' : ''}>${i}</button>`;
                }
                numPicker.innerHTML = html;
                const totalSelected = tempSelection.size + myPicks.length;
                selectedCountSpan.textContent = totalSelected;
            }

            function updateWheel() {
                const numbers = gameState.allTakenNumbers;
                if (numbers.length === 0) {
                    wheelNumbers.innerHTML =
                        '<div style="color:#b8d0e5;font-size:0.5rem;text-align:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4;">No numbers<br>chosen</div>';
                    return;
                }

                const total = numbers.length;
                const angleStep = 360 / total;
                let html = '';
                numbers.forEach((num, idx) => {
                    const angle = idx * angleStep;
                    const radius = 38;
                    const rad = (angle * Math.PI) / 180;
                    const x = 50 + radius * Math.sin(rad);
                    const y = 50 - radius * Math.cos(rad);
                    const isHighlighted = gameState.drawnNumbers.includes(num);
                    html +=
                        `<div class="wheel-number ${isHighlighted ? 'highlighted' : ''}" style="left:${x}%;top:${y}%;transform:translate(-50%,-50%);">${num}</div>`;
                });
                wheelNumbers.innerHTML = html;
            }

            function updatePlayerList() {
                let html = '';
                const playerIds = Object.keys(players);
                if (playerIds.length === 0) {
                    html = '<span style="color:#5a7a9a;font-size:0.6rem;">No players connected</span>';
                } else {
                    for (let id of playerIds) {
                        const p = players[id];
                        const isMe = (id === myId);
                        const hasPicks = p.picks && p.picks.length === PICK_LIMIT;
                        html +=
                            `<span class="player-tag ${isMe ? 'me' : ''} ${hasPicks ? 'ready' : ''}">${p.name} (${p.picks ? p.picks.length : 0}/5)</span>`;
                    }
                }
                playerListEl.innerHTML = html;
            }

            function updateUI() {
                timerDisplay.textContent = gameState.timer;
                roundDisplay.textContent = gameState.round;

                if (gameState.phase === 'selection') {
                    wheelContainer.classList.add('hidden');
                    spinResults.classList.add('hidden');
                    playerSelect.disabled = false;
                    if (gameState.timer > 0) {
                        updateStatus(`⏳ ${gameState.timer}s left to select numbers`);
                    } else {
                        updateStatus('⏳ Waiting for timer to start...');
                    }
                } else if (gameState.phase === 'spinning') {
                    wheelContainer.classList.remove('hidden');
                    spinResults.classList.remove('hidden');
                    playerSelect.disabled = true;
                } else if (gameState.phase === 'results') {
                    wheelContainer.classList.remove('hidden');
                    spinResults.classList.remove('hidden');
                    playerSelect.disabled = true;
                }

                // Update spin balls
                for (let i = 0; i < MAX_SPINS; i++) {
                    if (i < gameState.drawnNumbers.length) {
                        spinEls[i].textContent = gameState.drawnNumbers[i];
                        spinEls[i].classList.add('active');
                    } else {
                        spinEls[i].textContent = '•';
                        spinEls[i].classList.remove('active', 'winner');
                    }
                }

                // Highlight winners
                const allWinningNums = new Set();
                for (let w of gameState.winners) {
                    const wp = players[w];
                    if (wp && wp.picks) {
                        for (let num of wp.picks) {
                            if (gameState.drawnNumbers.includes(num)) {
                                allWinningNums.add(num);
                            }
                        }
                    }
                }
                spinEls.forEach(el => {
                    const num = parseInt(el.textContent);
                    if (allWinningNums.has(num)) {
                        el.classList.add('winner');
                    }
                });

                renderNumberPicker();
                updateWheel();
                updatePlayerList();

                // Connection status
                if (ws && ws.readyState === WebSocket.OPEN) {
                    connectionStatusEl.textContent = '🟢 Connected';
                    connectionStatusEl.className = 'connection-status connected';
                } else {
                    connectionStatusEl.textContent = '🔴 Disconnected';
                    connectionStatusEl.className = 'connection-status disconnected';
                }
            }

            // ----- WebSocket handlers -----
            function connect() {
                if (ws && ws.readyState === WebSocket.OPEN) return;

                const name = playerNameInput.value.trim() || 'Player';
                if (name.length > 12) name.substring(0, 12);

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.hostname || 'localhost';
                const port = window.location.port || 8080;
                const wsUrl = `${protocol}//${host}:${port}`;

                connStatus.textContent = 'Connecting...';

                try {
                    ws = new WebSocket(wsUrl);

                    ws.onopen = function() {
                        reconnectAttempts = 0;
                        if (reconnectTimer) {
                            clearTimeout(reconnectTimer);
                            reconnectTimer = null;
                        }
                        connStatus.textContent = 'Connected!';
                        connectionOverlay.style.display = 'none';
                        updateStatus('🟢 Connected! Select your numbers.');
                        ws.send(JSON.stringify({ type: 'join', name: name }));
                    };

                    ws.onmessage = function(event) {
                        try {
                            const msg = JSON.parse(event.data);
                            handleServerMessage(msg);
                        } catch (e) {
                            console.error('Error parsing message:', e);
                        }
                    };

                    ws.onclose = function() {
                        updateStatus('🔴 Disconnected. Reconnecting...');
                        connectionOverlay.style.display = 'flex';
                        connStatus.textContent = 'Disconnected. Retrying...';
                        if (reconnectAttempts < 10) {
                            reconnectAttempts++;
                            if (reconnectTimer) clearTimeout(reconnectTimer);
                            reconnectTimer = setTimeout(connect, 3000);
                        } else {
                            connStatus.textContent = 'Could not reconnect. Refresh page.';
                        }
                        updateUI();
                    };

                    ws.onerror = function() {
                        connStatus.textContent = 'Connection error. Retrying...';
                    };
                } catch (e) {
                    connStatus.textContent = 'Failed to connect: ' + e.message;
                }
            }

            function handleServerMessage(msg) {
                switch (msg.type) {
                    case 'init':
                        myId = msg.playerId;
                        players = msg.players;
                        gameState = msg.gameState;
                        updateUI();
                        connectionOverlay.style.display = 'none';
                        updateStatus(`✅ Connected as ${players[myId]?.name || 'Player'}`);
                        break;
                    case 'state':
                        players = msg.players;
                        gameState = msg.gameState;
                        updateUI();
                        break;
                    case 'spin_start':
                        gameState.phase = 'spinning';
                        gameState.drawnNumbers = [];
                        gameState.spinCount = 0;
                        updateUI();
                        updateStatus('🎡 Spinning wheel...');
                        break;
                    case 'spin_result':
                        gameState.drawnNumbers.push(msg.number);
                        gameState.spinCount = msg.spinNumber;
                        arrowContainer.style.transform = `rotate(${msg.totalRotation}deg)`;
                        arrowCenter.textContent = msg.number;
                        updateUI();
                        updateStatus(`🎯 Spin ${msg.spinNumber}/${MAX_SPINS}: <span class="highlight">${msg.number}</span>`);
                        break;
                    case 'spin_end':
                        gameState.phase = 'results';
                        gameState.winners = msg.winners;
                        updateUI();
                        if (msg.winners.length === 0) {
                            updateStatus(`🎲 No winners. Drawn: ${gameState.drawnNumbers.join(', ')}`);
                        } else {
                            let msgText = '';
                            if (msg.winners.length === 1) {
                                const w = msg.winners[0];
                                msgText = `${players[w]?.name || 'Player'} wins! 🎉 Numbers: ${gameState.drawnNumbers.join(', ')}`;
                            } else {
                                const names = msg.winners.map(id => players[id]?.name || 'Player').join(', ');
                                msgText = `${names} win! 🎉 Numbers: ${gameState.drawnNumbers.join(', ')}`;
                            }
                            updateStatus(msgText, true);
                        }
                        break;
                    case 'round_reset':
                        gameState = msg.gameState;
                        players = msg.players;
                        arrowContainer.style.transform = 'rotate(0deg)';
                        arrowCenter.textContent = '🎯';
                        updateUI();
                        updateStatus(`⏳ Round ${gameState.round}: Select your numbers before timer ends`);
                        break;
                    default:
                        console.log('Unknown message:', msg);
                }
            }

            // ----- Actions -----
            function savePicks() {
                if (!myId) {
                    updateStatus('❌ Not connected. Please wait.');
                    return;
                }
                const myPicks = players[myId]?.picks || [];
                const totalSelected = tempSelection.size + myPicks.length;
                if (totalSelected !== PICK_LIMIT) {
                    updateStatus(`❌ Select exactly ${PICK_LIMIT} numbers. Currently ${totalSelected}.`);
                    return;
                }
                // Check if any temp picks are already taken by others
                for (let num of tempSelection) {
                    if (gameState.allTakenNumbers.includes(num) && !myPicks.includes(num)) {
                        updateStatus(`❌ Number ${num} is already taken.`);
                        return;
                    }
                }
                const picks = Array.from(tempSelection);
                ws.send(JSON.stringify({ type: 'save_picks', picks: picks }));
                tempSelection = new Set();
                updateStatus(`✅ Picks saved! Waiting for timer...`);
            }

            function clearPicks() {
                tempSelection = new Set();
                renderNumberPicker();
                updateStatus(`🧹 Cleared temporary selection.`);
            }

            function showWinners() {
                if (gameState.winners.length === 0) {
                    winnersList.innerHTML = `<div class="no-winners">😔 No winners yet.</div>`;
                } else {
                    let html = '';
                    for (let id of gameState.winners) {
                        const p = players[id];
                        if (!p) continue;
                        const winningNums = p.picks.filter(num => gameState.drawnNumbers.includes(num));
                        html += `
                            <div class="winner-entry">
                                <span class="player-name">${p.name}</span>
                                <span class="winning-nums">🎯 ${winningNums.join(', ')}</span>
                            </div>
                        `;
                    }
                    winnersList.innerHTML = html;
                }
                winnersModal.classList.add('active');
            }

            function resetGameManually() {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'reset_game' }));
                }
            }

            // ----- Event handlers -----
            function handleNumClick(e) {
                const btn = e.target.closest('.num-btn');
                if (!btn || btn.disabled) return;
                const num = parseInt(btn.dataset.num, 10);
                if (isNaN(num)) return;

                const myPicks = players[myId]?.picks || [];
                if (gameState.allTakenNumbers.includes(num) && !myPicks.includes(num)) {
                    updateStatus(`❌ Number ${num} is already taken.`);
                    return;
                }

                if (tempSelection.has(num)) {
                    tempSelection.delete(num);
                } else {
                    if (tempSelection.size + myPicks.length >= PICK_LIMIT) {
                        updateStatus(`⚠️ You can only select ${PICK_LIMIT} numbers.`);
                        return;
                    }
                    tempSelection.add(num);
                }
                renderNumberPicker();
                const total = tempSelection.size + myPicks.length;
                updateStatus(`📌 ${total}/${PICK_LIMIT} selected. Save when ready.`);
            }

            // ----- UI listeners -----
            connectBtn.addEventListener('click', connect);
            playerNameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') connect();
            });

            document.getElementById('savePicksBtn').addEventListener('click', savePicks);
            document.getElementById('clearPicksBtn').addEventListener('click', clearPicks);
            document.getElementById('resetGameBtn').addEventListener('click', resetGameManually);
            document.getElementById('showWinnersBtn').addEventListener('click', showWinners);
            document.getElementById('closeModalBtn').addEventListener('click', () => {
                winnersModal.classList.remove('active');
            });
            winnersModal.addEventListener('click', (e) => {
                if (e.target === winnersModal) winnersModal.classList.remove('active');
            });
            numPicker.addEventListener('click', handleNumClick);

            // ----- Telegram Web App integration -----
            if (window.Telegram && Telegram.WebApp) {
                Telegram.WebApp.ready();
                Telegram.WebApp.expand();
                // Auto-fill name from Telegram
                if (Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
                    const user = Telegram.WebApp.initDataUnsafe.user;
                    let name = user.first_name || 'Player';
                    if (user.last_name) name += ' ' + user.last_name;
                    if (name.length > 12) name = name.substring(0, 12);
                    playerNameInput.value = name;
                }
            }

            // Initial UI state
            connectionOverlay.style.display = 'flex';
            updateUI();

            // Auto-connect after a moment (for quick testing)
            setTimeout(() => {
                if (playerNameInput.value) {
                    connect();
                }
            }, 500);
        })();
    </script>
</body>
</html>
